{% extends "base_generic.html" %}

{% block content %}
    <h1>News</h1>
    <meta name="description" content="Fresh news about cars">

    {% if articles %}
        {% for article in articles %}
            <article itemscope itemtype="https://schema.org/NewsArticle">
                <header>
                    <h2 itemprop="headline"><mark>{{ article.title }}</mark></h2>
                    <p itemprop="description">{{ article.summary }}</p>
                </header>
                <section>
                    <img itemprop="image" src="{{ article.image.url }}" alt="{{ article.title }}" style="max-width:300px; max-height:300px;">
                </section>
                <footer>
                    <details>
                        <summary>Read more</summary>
                        <p itemprop="articleBody">{{ article.content }}</p>
                    </details>
                </footer>
                <meta itemprop="datePublished" content="{{ article.date.isoformat }}">
                <meta itemprop="dateModified" content="{{ article.updated_date.isoformat }}">
                <meta itemscope itemprop="mainEntityOfPage" itemtype="https://schema.org/WebPage" itemid="{% url 'article_detail' article.id %}">
            </article>
        {% endfor %}
    {% else %}
        <p>No articles available.</p>
    {% endif %}
{% endblock %}
